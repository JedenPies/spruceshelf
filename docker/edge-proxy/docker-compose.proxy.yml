version: '3.8'

services:
  edge-proxy:
    image: nginx:alpine
    container_name: global-edge-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./letsencrypt:/etc/letsencrypt:ro
      - ./certbot-webroot:/var/www/certbot:ro
    networks:
      - gateway-network

networks:
  gateway-network:
    external: true