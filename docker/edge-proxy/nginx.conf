events {
    worker_connections 1024;
}

http {
    resolver 127.0.0.11 valid=30s ipv6=off;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Przekierowanie HTTP do HTTPS
    server {
        listen 80;
        server_name spruceshelf.com www.spruceshelf.com staging.spruceshelf.com;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # --- PRODUKCJA (spruceshelf.com) ---
    server {
        listen 443 ssl;
        http2 on;
        server_name spruceshelf.com www.spruceshelf.com;

        ssl_certificate /etc/letsencrypt/live/spruceshelf.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/spruceshelf.com/privkey.pem;

        # Frontend i domyślny ruch
        location / {
            set $prod_upstream http://prod-api-gateway:80;
            proxy_pass $prod_upstream;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }

        # SSE i Backend API (wymuszenie braku buforowania w kaskadzie)
        location /api/ {
            set $prod_upstream http://prod-api-gateway:80;
            proxy_pass $prod_upstream;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Kluczowe dla SSE:
            proxy_http_version 1.1;
            proxy_set_header Connection '';
            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding off;
            gzip off;

            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }
    }

    # --- STAGING (staging.spruceshelf.com) ---
    server {
        listen 443 ssl;
        http2 on;
        server_name staging.spruceshelf.com;

        ssl_certificate /etc/letsencrypt/live/spruceshelf.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/spruceshelf.com/privkey.pem;

        location / {
            set $staging_upstream http://staging-api-gateway:80;
            proxy_pass $staging_upstream;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }

        location /api/ {
            set $staging_upstream http://staging-api-gateway:80;
            proxy_pass $staging_upstream;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Kluczowe dla SSE:
            proxy_http_version 1.1;
            proxy_set_header Connection '';
            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding off;
            gzip off;

            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }
    }
}