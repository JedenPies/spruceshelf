events { worker_connections 1024; }

http {
    # Przekierowanie HTTP do HTTPS
    server {
        listen 80;
        server_name spruceshelf.com www.spruceshelf.com staging.spruceshelf.com;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # PROD (spruceshelf.com)
    server {
        listen 443 ssl;
        http2 on;
        server_name spruceshelf.com www.spruceshelf.com;

        ssl_certificate /etc/letsencrypt/live/spruceshelf.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/spruceshelf.com/privkey.pem;

        location / {
            proxy_pass http://prod-api-gateway:80;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # STAGING (staging.spruceshelf.com)
    server {
        listen 443 ssl;
        http2 on;
        server_name staging.spruceshelf.com;

        ssl_certificate /etc/letsencrypt/live/spruceshelf.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/spruceshelf.com/privkey.pem;

        location / {
            proxy_pass http://staging-api-gateway:80;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}